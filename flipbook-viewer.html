<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>AlbumStudio PRO · Digital Album</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2a;--line:#263650;--gold:#e9c36e;--text:#f4f6fb;--muted:#9aa9bf;--accent:#12b8a6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#1a2a42 0,#080d18 58%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px clamp(14px,3vw,32px);border-bottom:1px solid #263650;background:#09111fdc;backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.brand{font-weight:900;letter-spacing:.3px;color:#f7d98d}.brand small{display:block;font-size:10px;color:#a8b6cb;font-weight:600;letter-spacing:2px;margin-top:3px}.status{font-size:11px;color:#9fb1c9}
.main{width:min(100%,1100px);margin:auto;padding:24px 14px 32px;display:flex;flex-direction:column;align-items:center;gap:18px}.heading{text-align:center}.heading h1{margin:0;font-family:Georgia,serif;font-size:clamp(20px,4vw,30px);color:var(--gold);letter-spacing:.4px}.heading p{margin:7px 0 0;color:var(--muted);font-size:13px}
.book-wrap{width:min(92vw,760px);position:relative;perspective:1900px;filter:drop-shadow(0 25px 30px #0009)}.book{position:relative;width:100%;aspect-ratio:820/560;transform-style:preserve-3d;transform:rotateY(-1.5deg);background:#f7f4ee;border-radius:4px 9px 9px 4px;box-shadow:inset 9px 0 12px #0002,5px 4px 0 #bba875,8px 8px 0 #35302a;overflow:visible}
.page-under{position:absolute;inset:0;overflow:hidden;background:#f7f4ee;border-radius:4px 8px 8px 4px}.page-under img,.face img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:contain;background:#fff}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform .78s cubic-bezier(.22,.72,.18,1);z-index:3;border-radius:4px 8px 8px 4px}.sheet.flip-next{transform:rotateY(-180deg)}.sheet.flip-prev{transform:rotateY(180deg)}.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;background:#fff;border-radius:4px 8px 8px 4px}.face.front{box-shadow:inset 8px 0 12px #0002}.face.back{transform:rotateY(180deg);box-shadow:inset -8px 0 12px #0002}
.book:after{content:"";position:absolute;z-index:5;right:-5px;top:2%;bottom:2%;width:5px;background:linear-gradient(90deg,#c9b88d,#fff2c4,#6c6049);border-radius:0 3px 3px 0;box-shadow:2px 1px 5px #0008;pointer-events:none}.spine-shadow{position:absolute;left:0;top:0;bottom:0;width:13px;z-index:6;background:linear-gradient(90deg,#0003,transparent);pointer-events:none}
.controls{width:min(100%,620px);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;background:#101a2ad9;border:1px solid var(--line);padding:10px;border-radius:14px;box-shadow:0 10px 30px #0004}.controls button,.music button{border:1px solid #3b526f;background:linear-gradient(#203653,#14243a);color:#f4f7fc;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer}.controls button.primary,.music button{background:linear-gradient(120deg,#087f77,#11b9a4);border-color:#20d1be;color:#041b1a}.controls button:disabled{opacity:.35;cursor:not-allowed}.counter{min-width:115px;text-align:center;font-size:12px;color:#e8ca83;font-weight:800}.music{width:min(100%,620px);display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;background:#101a2ad9;border:1px solid var(--line);padding:10px;border-radius:14px}.music audio{width:min(100%,380px);height:34px}.music-note{font-size:11px;color:var(--muted)}.loading,.error{padding:22px;text-align:center;color:#c3d0e2;background:#111a2a;border:1px solid var(--line);border-radius:12px;width:min(100%,620px)}.error{color:#ffb6b6;border-color:#773b48}.footer{padding:18px;text-align:center;color:#72839b;font-size:10px;letter-spacing:.5px}.tap-help{font-size:11px;color:#9dadc3;text-align:center}.hidden{display:none!important}
@media(max-width:560px){.top{padding:12px}.status{font-size:10px}.main{padding:19px 8px 26px;gap:14px}.book-wrap{width:96vw}.controls{gap:6px;padding:8px}.controls button{padding:10px 11px}.music{padding:9px}.music audio{width:100%}}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">AlbumStudio PRO<small>DIGITAL WEDDING ALBUM</small></div><div class="status" id="loadStatus">Opening album…</div></header>
<main class="main">
  <section class="heading"><h1 id="albumTitle">Digital Album</h1><p id="albumSub">A beautiful collection of memories</p></section>
  <div class="loading" id="loading">Loading your album pages…</div>
  <div class="error hidden" id="errorBox"></div>
  <div class="book-wrap hidden" id="bookWrap">
    <div class="book" id="book">
      <div class="page-under"><img id="underImage" alt="Next album leaf"></div>
      <div class="sheet" id="sheet">
        <div class="face front"><img id="frontImage" alt="Current album leaf"></div>
        <div class="face back"><img id="backImage" alt="Turning album leaf"></div>
      </div>
      <div class="spine-shadow"></div>
    </div>
  </div>
  <div class="tap-help hidden" id="tapHelp">Swipe left/right or use the page buttons to turn each album leaf.</div>
  <nav class="controls hidden" id="controls" aria-label="Album navigation">
    <button id="firstBtn" title="First page">⟪ First</button>
    <button id="prevBtn" title="Previous page">‹ Previous</button>
    <span class="counter" id="pageCounter">Page 1 / 1</span>
    <button class="primary" id="nextBtn" title="Next page">Next ›</button>
    <button id="lastBtn" title="Last page">Last ⟫</button>
  </nav>
  <section class="music hidden" id="musicPanel">
    <button id="musicPlayBtn" type="button">▶ Play Music</button>
    <span class="music-note" id="musicHint">Background music from AlbumStudio PRO server</span>
    <audio id="albumMusic" controls loop preload="none"></audio>
  </section>
</main>
<footer class="footer">DIGITAL ALBUM · POWERED BY ALBUMSTUDIO PRO</footer>
<script>
(() => {
  'use strict';
  const API = 'https://addguru.xyz/album-api/api.php';
  const params = new URLSearchParams(location.search);
  const id = (params.get('id') || '').trim();
  const $ = value => document.getElementById(value);
  const roleOrder = { front: 0, 'first-page': 1, normal: 2, 'last-page': 3, back: 4 };
  let pages = [];
  let current = 0;
  let flipping = false;
  let touchStartX = null;

  function showError(message) {
    $('loading').classList.add('hidden');
    $('errorBox').textContent = message;
    $('errorBox').classList.remove('hidden');
    $('loadStatus').textContent = 'Album unavailable';
  }

  function expandUploadedPages(rawPages) {
    const ordered = rawPages.slice().sort((a, b) =>
      (roleOrder[a.role] ?? 2) - (roleOrder[b.role] ?? 2) || (Number(a.index) || 0) - (Number(b.index) || 0)
    );
    const result = [];
    let spreadNumber = 0;
    for (const page of ordered) {
      const role = page.role || 'normal';
      if (role === 'normal') {
        spreadNumber++;
        result.push({ url: page.url, crop: 'left', label: `Spread ${spreadNumber} · Left Page`, role: 'normal-left' });
        result.push({ url: page.url, crop: 'right', label: `Spread ${spreadNumber} · Right Page`, role: 'normal-right' });
      } else {
        const label = role === 'front' ? 'Front Cover' : role === 'first-page' ? 'First Page' : role === 'last-page' ? 'Last Page' : role === 'back' ? 'Back Cover' : 'Page';
        result.push({ url: page.url, crop: 'full', label, role });
      }
    }
    return result;
  }

  function setLeafImage(elementId, page) {
    const image = $(elementId);
    if (!page) { image.removeAttribute('src'); image.style.width = '100%'; image.style.left = '0'; image.style.objectFit = 'contain'; return; }
    image.src = page.url;
    image.style.width = page.crop === 'left' || page.crop === 'right' ? '200%' : '100%';
    image.style.left = page.crop === 'right' ? '-100%' : '0';
    image.style.objectFit = page.crop === 'full' ? 'contain' : 'fill';
  }

  function setPageImages(index) {
    const page = pages[index];
    const next = pages[Math.min(index + 1, pages.length - 1)] || page;
    setLeafImage('frontImage', page);
    setLeafImage('backImage', next);
    setLeafImage('underImage', next);
    $('pageCounter').textContent = `${index + 1} / ${pages.length}`;
    $('prevBtn').disabled = index <= 0;
    $('firstBtn').disabled = index <= 0;
    $('nextBtn').disabled = index >= pages.length - 1;
    $('lastBtn').disabled = index >= pages.length - 1;
    $('loadStatus').textContent = page ? page.label : 'Album ready';
    $('book').setAttribute('aria-label', `${page ? page.label : 'Page'} · ${index + 1} of ${pages.length}`);
  }

  function turn(delta) {
    if (flipping || !pages.length) return;
    const target = Math.max(0, Math.min(pages.length - 1, current + delta));
    if (target === current) return;
    flipping = true;

    const audio = $('albumMusic');
    if (audio.src && audio.paused && audio.dataset.userPaused !== '1') {
      audio.play().catch(() => {});
    }

    const sheet = $('sheet');
    setLeafImage('frontImage', pages[current]);
    setLeafImage('backImage', pages[target]);
    setLeafImage('underImage', pages[target]);
    sheet.classList.remove('flip-next', 'flip-prev');
    void sheet.offsetWidth;
    sheet.classList.add(delta > 0 ? 'flip-next' : 'flip-prev');
    window.setTimeout(() => {
      current = target;
      sheet.classList.remove('flip-next', 'flip-prev');
      setPageImages(current);
      flipping = false;
    }, 820);
  }

  $('firstBtn').addEventListener('click', () => { if (current) turn(-current); });
  $('prevBtn').addEventListener('click', () => turn(-1));
  $('nextBtn').addEventListener('click', () => turn(1));
  $('lastBtn').addEventListener('click', () => { if (current < pages.length - 1) turn(pages.length - 1 - current); });
  document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft') turn(-1);
    if (event.key === 'ArrowRight') turn(1);
  });
  $('bookWrap').addEventListener('touchstart', event => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
  $('bookWrap').addEventListener('touchend', event => {
    if (touchStartX === null) return;
    const distance = event.changedTouches[0].clientX - touchStartX;
    if (Math.abs(distance) > 45) turn(distance < 0 ? 1 : -1);
    touchStartX = null;
  }, { passive: true });

  const audio = $('albumMusic');
  $('musicPlayBtn').addEventListener('click', async () => {
    try {
      if (audio.paused) {
        audio.dataset.userPaused = '0';
        await audio.play();
        $('musicPlayBtn').textContent = '⏸ Pause Music';
      } else {
        audio.dataset.userPaused = '1';
        audio.pause();
        $('musicPlayBtn').textContent = '▶ Play Music';
      }
    } catch (_) {
      $('musicHint').textContent = 'Tap Play Music once to allow audio playback on this device.';
    }
  });
  audio.addEventListener('play', () => { $('musicPlayBtn').textContent = '⏸ Pause Music'; });
  audio.addEventListener('pause', () => { $('musicPlayBtn').textContent = '▶ Play Music'; });

  async function loadAlbum() {
    if (!id || !/^[a-zA-Z0-9_-]{4,64}$/.test(id)) {
      return showError('This QR link is incomplete or invalid. Please scan the album QR code again.');
    }
    try {
      const response = await fetch(API + '?action=get&id=' + encodeURIComponent(id), { cache: 'no-store' });
      if (response.status === 404) {
        throw new Error('Album server API not found (404). Please verify that api.php is uploaded to addguru.xyz/album-api/api.php.');
      }
      const result = await response.json();
      if (!response.ok || !result.ok) {
        throw new Error(result.error || 'Album could not be found.');
      }
      // Support both { book: { pages, title, musicUrl } } and flat { pages, title, musicUrl } JSON formats
      const book = result.book || result;
      const uploaded = Array.isArray(book.pages) ? book.pages.filter(page => page.url) : [];
      pages = expandUploadedPages(uploaded);
      if (!pages.length) throw new Error('No album pages are available on the server.');
      $('albumTitle').textContent = book.title || 'Digital Album';
      $('albumSub').textContent = `${pages.length} leaves · Swipe or tap Next to flip pages`;
      current = 0;
      setPageImages(current);
      $('loading').classList.add('hidden');
      $('bookWrap').classList.remove('hidden');
      $('tapHelp').classList.remove('hidden');
      $('controls').classList.remove('hidden');
      $('loadStatus').textContent = 'Album ready';
      if (book.musicUrl) {
        audio.src = book.musicUrl;
        $('musicPanel').classList.remove('hidden');
        audio.play().then(() => { $('musicPlayBtn').textContent = '⏸ Pause Music'; }).catch(() => {
          $('musicHint').textContent = 'Music is ready — tap Play Music or flip a page to start.';
        });
      }
    } catch (error) {
      showError(error && error.message ? error.message : 'Could not load this album.');
    }
  }
  loadAlbum();
})();
</script>
</body>
</html>
