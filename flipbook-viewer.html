<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>AlbumStudio PRO · 3D Digital Album</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070b14;
  --panel: #101929;
  --line: #263650;
  --gold: #f3ce7a;
  --text: #f4f6fb;
  --muted: #9aa9bf;
  --accent: #12b8a6;
}
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
html, body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(ellipse at 50% -10%, #1c2d4a 0%, #070b14 65%);
  color: var(--text);
  font-family: Inter, 'Segoe UI', Arial, sans-serif;
  overflow-x: hidden;
}
body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px clamp(14px, 3vw, 32px);
  border-bottom: 1px solid rgba(233, 195, 110, 0.2);
  background: rgba(9, 15, 28, 0.85);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand {
  font-weight: 900;
  font-size: 16px;
  letter-spacing: 0.4px;
  color: var(--gold);
}
.brand small {
  display: block;
  font-size: 9px;
  color: #a8b6cb;
  font-weight: 600;
  letter-spacing: 2px;
  margin-top: 2px;
}
.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.status {
  font-size: 12px;
  font-weight: 700;
  color: #e8ca83;
  background: rgba(255, 255, 255, 0.05);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid rgba(233, 195, 110, 0.25);
}
.icon-btn {
  border: 1px solid #3b526f;
  background: #16243a;
  color: #f4f7fc;
  border-radius: 8px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}
.icon-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.main {
  width: min(100%, 1380px);
  margin: auto;
  padding: 14px 16px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 5;
  flex: 1;
  justify-content: center;
}
.heading { text-align: center; }
.heading h1 {
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(18px, 3vw, 26px);
  color: var(--gold);
  letter-spacing: 0.5px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.6);
}
.heading p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.book-wrap {
  width: min(96vw, 1220px);
  position: relative;
  perspective: 2400px;
  filter: drop-shadow(0 28px 36px rgba(0, 0, 0, 0.85));
}
.book {
  position: relative;
  width: 100%;
  aspect-ratio: 1640 / 560;
  transform-style: preserve-3d;
  transform: rotateX(2.5deg);
  border-radius: 8px;
  transition: transform 0.45s cubic-bezier(0.22, 0.7, 0.2, 1);
}

/* Closed Cover States: Center the closed cover & hide the opposite side */
.book.closed-front {
  transform: translateX(-25%) rotateX(2.5deg);
}
.book.closed-back {
  transform: translateX(25%) rotateX(2.5deg);
}

/* Dynamic Hardcover Rim */
.book::before {
  content: "";
  position: absolute;
  top: -4px;
  bottom: -9px;
  left: -7px;
  right: -7px;
  background: linear-gradient(180deg, #3c3122, #1f1912);
  border: 2px solid #c8a962;
  border-radius: 10px;
  z-index: 0;
  box-shadow: 0 12px 28px rgba(0,0,0,0.8);
  transition: left 0.35s ease, right 0.35s ease;
}
.book.closed-front::before {
  left: calc(50% - 5px);
}
.book.closed-back::before {
  right: calc(50% - 5px);
}

.half-page {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  overflow: hidden;
  background: #fdfbf7;
  z-index: 2;
  backface-visibility: hidden;
  transition: opacity 0.2s ease;
}
.half-page.left {
  left: 0;
  border-radius: 6px 0 0 6px;
  box-shadow: inset -14px 0 22px rgba(0,0,0,0.22), -3px 0 0 #d9d0c1, -6px 0 0 #b8ae9e;
}
.half-page.right {
  right: 0;
  border-radius: 0 6px 6px 0;
  box-shadow: inset 14px 0 22px rgba(0,0,0,0.22), 3px 0 0 #d9d0c1, 6px 0 0 #b8ae9e;
}

/* Completely hidden side when album is closed */
.half-page.closed-side {
  opacity: 0;
  pointer-events: none;
  background: transparent;
  box-shadow: none;
}

.half-page.blank-paper {
  background: linear-gradient(135deg, #fffdfa 0%, #f3efe6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
.half-page.blank-paper::after {
  content: "AlbumStudio PRO";
  font-family: Georgia, serif;
  font-size: clamp(12px, 1.6vw, 18px);
  color: rgba(165, 148, 114, 0.35);
  letter-spacing: 3px;
  font-weight: bold;
}

.page-art {
  width: 100%;
  height: 100%;
  background-repeat: no-repeat;
  background-color: #fff;
  pointer-events: none;
}

.turn-sheet {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  transform-style: preserve-3d;
  z-index: 8;
  pointer-events: none;
  transition: transform 0.85s cubic-bezier(0.24, 0.74, 0.2, 1);
}
.turn-sheet.next {
  left: 50%;
  transform-origin: left center;
}
.turn-sheet.next.turning {
  transform: rotateY(-180deg);
}
.turn-sheet.prev {
  left: 0;
  transform-origin: right center;
}
.turn-sheet.prev.turning {
  transform: rotateY(180deg);
}
.turn-face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  backface-visibility: hidden;
  background: #fff;
}
.turn-face.front {
  border-radius: 0 6px 6px 0;
  box-shadow: inset 12px 0 20px rgba(0,0,0,0.22), 0 12px 30px rgba(0,0,0,0.45);
}
.turn-face.back {
  transform: rotateY(180deg);
  border-radius: 6px 0 0 6px;
  box-shadow: inset -12px 0 20px rgba(0,0,0,0.22), 0 12px 30px rgba(0,0,0,0.45);
}
.turn-sheet.prev .turn-face.front {
  border-radius: 6px 0 0 6px;
}
.turn-sheet.prev .turn-face.back {
  border-radius: 0 6px 6px 0;
}

.spine {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 28px;
  transform: translateX(-50%);
  z-index: 10;
  background: linear-gradient(90deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.35) 38%,
    rgba(20,15,10,0.75) 50%,
    rgba(255,255,255,0.18) 54%,
    rgba(0,0,0,0.35) 64%,
    rgba(0,0,0,0) 100%);
  pointer-events: none;
  transition: opacity 0.25s;
}

.click-zone {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 18%;
  z-index: 12;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s;
}
.click-zone:hover { opacity: 1; }
.click-zone.left { left: 0; justify-content: flex-start; padding-left: 12px; }
.click-zone.right { right: 0; justify-content: flex-end; padding-right: 12px; }
.zone-arrow {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(10, 16, 28, 0.78);
  border: 1px solid var(--gold);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 4px 14px rgba(0,0,0,0.6);
}

.tap-help {
  font-size: 11px;
  color: #9dadc3;
  text-align: center;
}

.controls {
  width: min(100%, 720px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  background: rgba(16, 26, 42, 0.88);
  border: 1px solid var(--line);
  padding: 9px 14px;
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}
.controls button, .music button {
  border: 1px solid #3b526f;
  background: linear-gradient(#203653, #14243a);
  color: #f4f7fc;
  border-radius: 9px;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
}
.controls button:hover:not(:disabled) {
  border-color: var(--gold);
  transform: translateY(-1px);
}
.controls button.primary, .music button {
  background: linear-gradient(120deg, #087f77, #11b9a4);
  border-color: #20d1be;
  color: #041b1a;
}
.controls button.active-auto {
  background: linear-gradient(120deg, #d97706, #f59e0b);
  border-color: #fde68a;
  color: #111;
}
.controls button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.counter {
  min-width: 120px;
  text-align: center;
  font-size: 12px;
  color: #e8ca83;
  font-weight: 800;
}

.music {
  width: min(100%, 720px);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: rgba(16, 26, 42, 0.88);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 14px;
}
.music audio { width: min(100%, 340px); height: 32px; }
.music-note { font-size: 11px; color: var(--muted); }

.loading, .error {
  padding: 24px;
  text-align: center;
  color: #c3d0e2;
  background: #111a2a;
  border: 1px solid var(--line);
  border-radius: 12px;
  width: min(100%, 620px);
}
.error { color: #ffb6b6; border-color: #773b48; }
.footer {
  padding: 12px;
  text-align: center;
  color: #72839b;
  font-size: 10px;
  letter-spacing: 0.6px;
  position: relative;
  z-index: 5;
}
.hidden { display: none !important; }

@media (max-width: 640px) {
  .top { padding: 10px 12px; }
  .status { font-size: 10px; padding: 4px 8px; }
  .main { padding: 10px 6px 18px; gap: 10px; }
  .book-wrap { width: 98vw; }
  .controls { gap: 6px; padding: 8px; }
  .controls button { padding: 8px 10px; font-size: 11px; }
  .counter { min-width: 90px; font-size: 11px; }
}
</style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

<canvas id="bgCanvas"></canvas>

<header class="top">
  <div class="brand">AlbumStudio PRO<small>3D DIGITAL WEDDING ALBUM</small></div>
  <div class="top-right">
    <div class="status" id="loadStatus">Opening album…</div>
    <button class="icon-btn" id="fullscreenBtn" type="button" title="Toggle Fullscreen">⛶ Fullscreen</button>
  </div>
</header>

<main class="main">
  <section class="heading">
    <h1 id="albumTitle">Digital Wedding Album</h1>
    <p id="albumSub">3D Interactive Wedding Album</p>
  </section>

  <div class="loading" id="loading">Loading your 3D album…</div>
  <div class="error hidden" id="errorBox"></div>

  <div class="book-wrap hidden" id="bookWrap">
    <div class="book closed-front" id="book">
      <div class="half-page left closed-side" id="leftPage"></div>
      <div class="half-page right" id="rightPage"></div>
      <div class="turn-sheet hidden" id="turnSheet">
        <div class="turn-face front" id="turnFront"></div>
        <div class="turn-face back" id="turnBack"></div>
      </div>
      <div class="spine" id="spine" style="opacity:0;"></div>
      <div class="click-zone left" id="zoneLeft" title="Previous Page"><div class="zone-arrow">‹</div></div>
      <div class="click-zone right" id="zoneRight" title="Open / Next Page"><div class="zone-arrow">›</div></div>
    </div>
  </div>

  <div class="tap-help hidden" id="tapHelp">Tap the album cover or click Next to open the album and flip pages.</div>

  <nav class="controls hidden" id="controls" aria-label="Album navigation">
    <button id="firstBtn" title="Front Cover">⟪ First</button>
    <button id="prevBtn" title="Previous Page">‹ Prev</button>
    <span class="counter" id="pageCounter">1 / 1</span>
    <button class="primary" id="nextBtn" title="Open / Next Page">Next ›</button>
    <button id="lastBtn" title="Back Cover">Last ⟫</button>
    <button id="autoPlayBtn" type="button" title="Auto Flip Slideshow">▶ Auto Play</button>
  </nav>

  <section class="music hidden" id="musicPanel">
    <button id="musicPlayBtn" type="button">▶ Play Music</button>
    <span class="music-note" id="musicHint">Background music from AlbumStudio PRO Cloud</span>
    <audio id="albumMusic" controls loop preload="none" controlsList="nodownload"></audio>
  </section>
</main>

<footer class="footer">3D DIGITAL ALBUM · POWERED BY ALBUMSTUDIO PRO</footer>

<script>
(() => {
  'use strict';

  /* ===== Anti-Copy, Anti-Inspect & Code Protection ===== */
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('copy', e => e.preventDefault());
  document.addEventListener('cut', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) ||
      (e.metaKey && e.altKey && (k === 'i' || k === 'j' || k === 'c' || k === 'u')) ||
      ((e.ctrlKey || e.metaKey) && (k === 'u' || k === 's' || k === 'p' || k === 'c' || k === 'a'))
    ) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  const API = 'https://addguru.xyz/album-api/api.php';
  const params = new URLSearchParams(location.search);
  const id = (params.get('id') || '').trim();
  const $ = val => document.getElementById(val);
  const roleOrder = { front: 0, 'first-page': 1, normal: 2, 'last-page': 3, back: 4 };

  let spreads = [];
  let current = 0;
  let flipping = false;
  let touchStartX = null;
  let autoTimer = null;

  function showError(message) {
    $('loading').classList.add('hidden');
    $('errorBox').textContent = message;
    $('errorBox').classList.remove('hidden');
    $('loadStatus').textContent = 'Album unavailable';
  }

  // Front Cover & Back Cover are true CLOSED single-cover states (no white page beside them)
  function buildFullBookSpreads(rawPages) {
    const ordered = rawPages.slice().sort((a, b) =>
      (roleOrder[a.role] ?? 2) - (roleOrder[b.role] ?? 2) || (Number(a.index) || 0) - (Number(b.index) || 0)
    );
    const list = [];
    let spreadCount = 0;

    for (const p of ordered) {
      const role = p.role || 'normal';
      if (role === 'front') {
        list.push({
          type: 'front-cover',
          label: 'Front Cover (Closed)',
          left: { mode: 'closed' },
          right: { url: p.url, mode: 'single' }
        });
      } else if (role === 'first-page') {
        list.push({
          type: 'first-page',
          label: 'First Inside Page',
          left: { mode: 'blank' },
          right: { url: p.url, mode: 'single' }
        });
      } else if (role === 'last-page') {
        list.push({
          type: 'last-page',
          label: 'Last Inside Page',
          left: { url: p.url, mode: 'single' },
          right: { mode: 'blank' }
        });
      } else if (role === 'back') {
        list.push({
          type: 'back-cover',
          label: 'Back Cover (Closed)',
          left: { url: p.url, mode: 'single' },
          right: { mode: 'closed' }
        });
      } else {
        spreadCount++;
        list.push({
          type: 'spread',
          label: `Full Spread ${spreadCount}`,
          left: { url: p.url, mode: 'left-half' },
          right: { url: p.url, mode: 'right-half' }
        });
      }
    }
    return list;
  }

  function renderSideContent(container, sideData) {
    container.innerHTML = '';
    container.classList.remove('blank-paper', 'closed-side');
    if (!sideData || sideData.mode === 'closed') {
      container.classList.add('closed-side');
      return;
    }
    if (sideData.mode === 'blank' || !sideData.url) {
      container.classList.add('blank-paper');
      return;
    }
    const div = document.createElement('div');
    div.className = 'page-art';
    if (sideData.mode === 'single') {
      div.style.backgroundImage = `url("${sideData.url}")`;
      div.style.backgroundSize = '100% 100%';
      div.style.backgroundPosition = 'center center';
    } else if (sideData.mode === 'left-half') {
      div.style.backgroundImage = `url("${sideData.url}")`;
      div.style.backgroundSize = '200% 100%';
      div.style.backgroundPosition = 'left center';
    } else if (sideData.mode === 'right-half') {
      div.style.backgroundImage = `url("${sideData.url}")`;
      div.style.backgroundSize = '200% 100%';
      div.style.backgroundPosition = 'right center';
    }
    container.appendChild(div);
  }

  function applyClosedBookPosition(sp) {
    const book = $('book');
    const spine = $('spine');
    book.classList.remove('closed-front', 'closed-back');
    if (sp.left.mode === 'closed' && sp.right.mode !== 'closed') {
      book.classList.add('closed-front');
      spine.style.opacity = '0';
    } else if (sp.right.mode === 'closed' && sp.left.mode !== 'closed') {
      book.classList.add('closed-back');
      spine.style.opacity = '0';
    } else {
      spine.style.opacity = '1';
    }
  }

  function renderStaticSpread(index) {
    const sp = spreads[index];
    if (!sp) return;
    applyClosedBookPosition(sp);
    renderSideContent($('leftPage'), sp.left);
    renderSideContent($('rightPage'), sp.right);
    $('pageCounter').textContent = `${index + 1} / ${spreads.length}`;
    $('loadStatus').textContent = sp.label;
    $('prevBtn').disabled = index <= 0;
    $('firstBtn').disabled = index <= 0;
    $('nextBtn').disabled = index >= spreads.length - 1;
    $('lastBtn').disabled = index >= spreads.length - 1;
  }

  function turnSpread(delta) {
    if (flipping || !spreads.length) return;
    const target = Math.max(0, Math.min(spreads.length - 1, current + delta));
    if (target === current) {
      if (autoTimer) stopAutoPlay();
      return;
    }
    flipping = true;

    const audio = $('albumMusic');
    if (audio.src && audio.paused && audio.dataset.userPaused !== '1') {
      audio.play().catch(() => {});
    }

    const fromSp = spreads[current];
    const toSp = spreads[target];
    const book = $('book');
    const spine = $('spine');
    const turnSheet = $('turnSheet');
    const turnFront = $('turnFront');
    const turnBack = $('turnBack');

    // Smoothly transition book position to target state (open or closed) as the cover flips
    applyClosedBookPosition(toSp);
    if (fromSp.left.mode !== 'closed' || toSp.left.mode !== 'closed') {
      spine.style.opacity = '1';
    }

    turnSheet.classList.remove('hidden', 'next', 'prev', 'turning');

    if (delta > 0) {
      turnSheet.classList.add('next');
      renderSideContent(turnFront, fromSp.right);
      renderSideContent(turnBack, toSp.left.mode === 'closed' ? { mode: 'blank' } : toSp.left);
      renderSideContent($('leftPage'), fromSp.left);
      renderSideContent($('rightPage'), toSp.right);
    } else {
      turnSheet.classList.add('prev');
      renderSideContent(turnFront, fromSp.left);
      renderSideContent(turnBack, toSp.right.mode === 'closed' ? { mode: 'blank' } : toSp.right);
      renderSideContent($('leftPage'), toSp.left);
      renderSideContent($('rightPage'), fromSp.right);
    }

    void turnSheet.offsetWidth;
    requestAnimationFrame(() => {
      turnSheet.classList.add('turning');
    });

    window.setTimeout(() => {
      current = target;
      turnSheet.classList.add('hidden');
      turnSheet.classList.remove('next', 'prev', 'turning');
      renderStaticSpread(current);
      flipping = false;
    }, 860);
  }

  function stopAutoPlay() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
    $('autoPlayBtn').textContent = '▶ Auto Play';
    $('autoPlayBtn').classList.remove('active-auto');
  }

  $('autoPlayBtn').addEventListener('click', () => {
    if (autoTimer) {
      stopAutoPlay();
      return;
    }
    $('autoPlayBtn').textContent = '⏸ Stop Auto';
    $('autoPlayBtn').classList.add('active-auto');
    autoTimer = setInterval(() => {
      if (current < spreads.length - 1) {
        turnSpread(1);
      } else {
        current = 0;
        renderStaticSpread(0);
      }
    }, 3400);
  });

  $('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  $('firstBtn').addEventListener('click', () => { if (!flipping && current > 0) { current = 0; renderStaticSpread(0); } });
  $('prevBtn').addEventListener('click', () => turnSpread(-1));
  $('nextBtn').addEventListener('click', () => turnSpread(1));
  $('lastBtn').addEventListener('click', () => { if (!flipping && current < spreads.length - 1) { current = spreads.length - 1; renderStaticSpread(current); } });
  $('zoneLeft').addEventListener('click', () => turnSpread(-1));
  $('zoneRight').addEventListener('click', () => turnSpread(1));

  // Allow clicking directly on the closed Front Cover to open the album
  $('rightPage').addEventListener('click', () => {
    if (current === 0) turnSpread(1);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') turnSpread(-1);
    if (e.key === 'ArrowRight') turnSpread(1);
  });

  $('bookWrap').addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].clientX;
  }, { passive: true });
  $('bookWrap').addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) turnSpread(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, { passive: true });

  const audio = $('albumMusic');
  $('musicPlayBtn').addEventListener('click', async () => {
    try {
      if (audio.paused) {
        audio.dataset.userPaused = '0';
        await audio.play();
        $('musicPlayBtn').textContent = '⏸ Pause Music';
      } else {
        audio.dataset.userPaused = '1';
        audio.pause();
        $('musicPlayBtn').textContent = '▶ Play Music';
      }
    } catch (_) {
      $('musicHint').textContent = 'Tap Play Music once to enable sound.';
    }
  });
  audio.addEventListener('play', () => { $('musicPlayBtn').textContent = '⏸ Pause Music'; });
  audio.addEventListener('pause', () => { $('musicPlayBtn').textContent = '▶ Play Music'; });

  function preloadAllImages(rawPages) {
    rawPages.forEach(p => {
      if (p.url) {
        const img = new Image();
        img.src = p.url;
      }
    });
  }

  async function loadAlbum() {
    if (!id || !/^[a-zA-Z0-9_-]{4,64}$/.test(id)) {
      return showError('This QR link is incomplete or invalid. Please scan the album QR code again.');
    }
    try {
      const response = await fetch(API + '?action=get&id=' + encodeURIComponent(id), { cache: 'no-store' });
      if (response.status === 404) {
        throw new Error('Album server API not found (404). Please verify api.php on addguru.xyz.');
      }
      const result = await response.json();
      if (!response.ok || !result.ok) {
        throw new Error(result.error || 'Album could not be found.');
      }
      const book = result.book || result;
      const uploaded = Array.isArray(book.pages) ? book.pages.filter(p => p.url) : [];
      if (!uploaded.length) throw new Error('No album pages are available on the server.');

      preloadAllImages(uploaded);
      spreads = buildFullBookSpreads(uploaded);

      $('albumTitle').textContent = book.title || 'Digital Wedding Album';
      $('albumSub').textContent = `${spreads.length} Interactive 3D Views · Tap Cover or Next to Open`;
      current = 0;
      renderStaticSpread(0);

      $('loading').classList.add('hidden');
      $('bookWrap').classList.remove('hidden');
      $('tapHelp').classList.remove('hidden');
      $('controls').classList.remove('hidden');

      if (book.musicUrl) {
        audio.src = book.musicUrl;
        $('musicPanel').classList.remove('hidden');
        audio.play().then(() => {
          $('musicPlayBtn').textContent = '⏸ Pause Music';
        }).catch(() => {
          $('musicHint').textContent = 'Music is ready — tap Play Music or open the cover to start.';
        });
      }
    } catch (err) {
      showError(err && err.message ? err.message : 'Could not load this album.');
    }
  }

  function initParticles() {
    const canvas = $('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });
    const dots = Array.from({ length: 42 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.6,
      vy: -(Math.random() * 0.35 + 0.1),
      vx: (Math.random() - 0.5) * 0.25,
      a: Math.random() * 0.55 + 0.15
    }));
    function draw() {
      ctx.clearRect(0, 0, w, h);
      dots.forEach(d => {
        d.x = (d.x + d.vx + w) % w;
        d.y = (d.y + d.vy + h) % h;
        ctx.fillStyle = `rgba(243, 206, 122, ${d.a})`;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();
  }

  initParticles();
  loadAlbum();
})();
</script>
</body>
</html>
